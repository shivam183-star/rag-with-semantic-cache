services:
  - type: web
    name: rag-semantic-cache-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: SMALL_LLM_MODEL
        value: openai/gpt-oss-20b
      - key: TOP_K
        value: "8"
      - key: CACHE_THRESHOLD
        value: "0.90"
      - key: CACHE_TTL_SECONDS
        value: "604800"
      - key: GROQ_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite:///./metrics.db
